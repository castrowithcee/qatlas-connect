name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Golden files are compared byte for byte, so Windows must not check them out with CRLF.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      # A short DNS or network outage on the runner must not fail the job before any test runs.
      - name: Download modules
        run: |
          for delay in 10 30 0; do
            go mod download && exit 0
            status=$?
            [ "$delay" -eq 0 ] && exit "$status"
            echo "go mod download failed with exit $status, retrying in ${delay}s"
            sleep "$delay"
          done
      - name: Build
        run: go build ./...
      # Updaters from v3.4.0 on accept a program file of up to 256 MiB; older installations update through v3.4.0
      # or reinstall. The limit keeps a margin below the updater limit.
      - name: Release binary size
        if: runner.os == 'Linux'
        env:
          LIMIT_MIB: 240
          WARN_MIB: 200
        run: |
          limit=$((LIMIT_MIB * 1024 * 1024))
          warn=$((WARN_MIB * 1024 * 1024))
          binary="$RUNNER_TEMP/size-check"
          status=0
          # Same targets and flags as scripts/release.sh.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath \
              -ldflags "-s -w -X github.com/castrowithcee/qatlas-connect/internal/cli.version=v0.0.0-size" \
              -o "$binary" .
            size=$(wc -c < "$binary")
            echo "$target: $size bytes, limit $limit"
            if [ "$size" -ge "$limit" ]; then
              echo "::error::$target binary is $size bytes, at or above the limit of $LIMIT_MIB MiB"
              status=1
            elif [ "$size" -ge "$warn" ]; then
              echo "::warning::$target binary is $size bytes, at or above the warning mark of $WARN_MIB MiB"
            fi
          done
          rm -f "$binary"
          exit "$status"
      - name: Vet
        run: go vet ./...
      # go test starts packages in the order given. The longest packages come last in ./..., and on a runner
      # with few cores they would run nearly alone at the end; started first, they overlap with the rest.
      - name: Test
        run: go test -count=1 -timeout 25m ./internal/tui ./scripts ./internal/web ./...
